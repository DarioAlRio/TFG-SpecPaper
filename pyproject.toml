[project]
name = "articulos-ia"
version = "0.1.0"
description = "Equipo de agentes de IA para redactar artículos científicos a partir de una especificación (TFG)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
articulos-ia = "articulos_ia.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
articulos_ia = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
